openapi: 3.0.0
info:
  version: 1.0.0
  title: WarmHouse Authentication API
paths:
  /api/v1/auth/token:
    post:
      summary: Получение токена доступа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Неверные учетные данные
  /api/v1/auth/validate:
    post:
      summary: Валидация токена доступа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTokenRequest'
      responses:
        '200':
          description: Токен валиден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidationResponse'
        '401':
          description: Токен невалиден
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
    ValidateTokenRequest:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    TokenValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        user_id:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
